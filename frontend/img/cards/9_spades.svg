<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="116" height="166" rx="10" ry="10" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="6" y="6" width="108" height="158" rx="7" ry="7" fill="none" stroke="#0f172a" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Top-Left Corner -->
  <g transform="translate(8, 10)">
    <text x="0" y="14" font-size="16" font-weight="900" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif">9</text>
    <g transform="translate(0, 18) scale(0.16)">
      <path d="M 50,14 C 38,32 20,42 20,58 C 20,72 32,80 44,76 L 42,90 L 58,90 L 56,76 C 68,80 80,72 80,58 C 80,42 62,32 50,14 Z" fill="#0f172a"/>
    </g>
  </g>

  <!-- Center Artwork -->
  
        <!-- Number Card Center -->
        <g transform="translate(34, 56) scale(0.52)">
            <path d="M 50,14 C 38,32 20,42 20,58 C 20,72 32,80 44,76 L 42,90 L 58,90 L 56,76 C 68,80 80,72 80,58 C 80,42 62,32 50,14 Z" fill="#0f172a" />
        </g>
        <text x="60" y="90" font-size="18" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">9</text>
        

  <!-- Bottom-Right Corner (Inverted) -->
  <g transform="translate(112, 160) rotate(180)">
    <text x="0" y="14" font-size="16" font-weight="900" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif">9</text>
    <g transform="translate(0, 18) scale(0.16)">
      <path d="M 50,14 C 38,32 20,42 20,58 C 20,72 32,80 44,76 L 42,90 L 58,90 L 56,76 C 68,80 80,72 80,58 C 80,42 62,32 50,14 Z" fill="#0f172a"/>
