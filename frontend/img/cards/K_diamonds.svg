<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="116" height="166" rx="10" ry="10" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="6" y="6" width="108" height="158" rx="7" ry="7" fill="none" stroke="#ea580c" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Top-Left Corner -->
  <g transform="translate(8, 10)">
    <text x="0" y="14" font-size="16" font-weight="900" fill="#ea580c" font-family="system-ui, -apple-system, sans-serif">K</text>
    <g transform="translate(0, 18) scale(0.16)">
      <path d="M 50,12 L 82,50 L 50,88 L 18,50 Z" fill="#ea580c"/>
    </g>
  </g>

  <!-- Center Artwork -->
  
        <!-- Royal Card Frame -->
        <rect x="28" y="44" width="64" height="76" rx="8" fill="#f8fafc" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,2"/>
        <g transform="translate(42, 54) scale(0.36)">
            <path d="M 50,12 L 82,50 L 50,88 L 18,50 Z" fill="#ea580c" />
        </g>
        <text x="60" y="98" font-size="28" font-weight="900" text-anchor="middle" fill="#ea580c" font-family="system-ui, -apple-system, sans-serif">K</text>
        <text x="60" y="112" font-size="8" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#ea580c" opacity="0.75" font-family="system-ui, -apple-system, sans-serif">КОРОЛЬ</text>
        

  <!-- Bottom-Right Corner (Inverted) -->
  <g transform="translate(112, 160) rotate(180)">
    <text x="0" y="14" font-size="16" font-weight="900" fill="#ea580c" font-family="system-ui, -apple-system, sans-serif">K</text>
    <g transform="translate(0, 18) scale(0.16)">
      <path d="M 50,12 L 82,50 L 50,88 L 18,50 Z" fill="#ea580c"/>
    </g>
  </g>
</svg>